apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs454-midterm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cs454-midterm
  template:
    metadata:
      labels:
        app: cs454-midterm
    spec:
      containers:
        - name: api
          image: cs454-midterm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SERVICE_NAME
              value: kubernetes-service
            - name: MESSAGE
              value: "Hello from the Kubernetes Deployment!"
